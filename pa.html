<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puesto de acción · Tropa San Francisco Javier</title>
<link rel="icon" type="image/png" href="marca-agua.png">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scout.css">
</head>
<body>
<header class="topbar">
  <a href="patrulla.html" id="home" class="brand"><span class="brand-logo"><img src="marca-agua.png" alt="Logo Scouts"></span><span>Tropa San Francisco Javier</span></a>
  <nav class="nav"><a href="profundiza-pa.html" id="volver">← Todos los puestos</a></nav>
</header>
<main class="pagina">
  <div class="pa-cab"><span class="em" id="em">⚜️</span><div><h1 id="titulo">Puesto</h1><p class="sub" id="desc" style="margin:2px 0 0"></p></div></div>
  <div id="quien" class="pa-quien oculto"></div>
  <div id="secciones"></div>
  <div class="pa-nav"><a id="ant" href="#">← Anterior</a><a id="sig" href="#">Siguiente →</a></div>
</main>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { PA, TIPOS, porSlug, enlaceSeguro } from "./puestos-data.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, doc, getDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p = porSlug(new URLSearchParams(location.search).get("p")) || PA[0];

const i = PA.indexOf(p);
document.title = `${p.nombre} · Tropa San Francisco Javier`;
$("em").textContent = p.emoji; $("titulo").textContent = p.nombre; $("desc").textContent = p.resumen;
const ant = PA[(i + PA.length - 1) % PA.length], sig = PA[(i + 1) % PA.length];
$("ant").href = "pa.html?p=" + ant.slug; $("ant").textContent = "← " + ant.nombre;
$("sig").href = "pa.html?p=" + sig.slug; $("sig").textContent = sig.nombre + " →";

onAuthStateChanged(auth, async (u) => {
  if (!u) { window.location.href = "acceso-patrulla.html"; return; }
  let yo;
  try { const s = await getDoc(doc(db, "usuarios", u.uid)); if (!s.exists()) { window.location.href = "acceso-patrulla.html"; return; } yo = s.data(); }
  catch (e) { console.error(e); return; }
  const kraal = yo.rol === "JT" || yo.rol === "kraal";
  if (kraal) {
    $("volver").textContent = "← Panel de jefes"; $("volver").href = "gestion-pa.html?p=" + p.slug;
    document.querySelector(".brand").href = "dashboard.html";
  } else if (yo.patrulla) {
    // Quién lleva este puesto en tu patrulla
    onSnapshot(query(collection(db, "usuarios"), where("patrulla", "==", yo.patrulla)), (snap) => {
      const quienes = snap.docs.map(d => d.data()).filter(x => (x.puestos || []).includes(p.nombre)).map(x => x.nombre || x.usuario);
      $("quien").classList.remove("oculto");
      $("quien").textContent = quienes.length ? `En tu patrulla lleva este puesto: ${quienes.join(", ")}.` : "Este puesto aún está sin asignar en tu patrulla.";
    }, () => {});
  }

  onSnapshot(doc(db, "pa_puestos", p.slug), (s) => { if (s.exists() && s.data().descripcion) $("desc").textContent = s.data().descripcion; }, () => {});

  onSnapshot(query(collection(db, "pa_items"), where("puesto", "==", p.slug)), (snap) => {
    const items = snap.docs.map(d => d.data()).sort((a, b) => (a.creadoEn || 0) - (b.creadoEn || 0));
    const html = TIPOS.map(t => {
      const xs = items.filter(x => x.tipo === t.id);
      if (!xs.length) return "";
      return `<section class="card pa-sec"><h2>${t.icono} ${t.titulo}</h2>${xs.map(x => {
        const url = enlaceSeguro(x.enlace);
        return `<div class="pa-item">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(x.texto)} ↗</a>` : esc(x.texto)}</div>`;
      }).join("")}</section>`;
    }).join("");
    $("secciones").innerHTML = html || `<p class="vacio">La jefatura todavía no ha añadido contenido a este puesto.</p>`;
  }, (e) => {
    $("secciones").innerHTML = `<p class="vacio error-fs">${e.code === "permission-denied" ? "Sin permiso: la jefatura debe publicar las reglas nuevas (firestore.rules)." : "No se pudo cargar: " + esc(e.message)}</p>`;
  });
});
</script>
</body>
</html>
