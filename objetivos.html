<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav class="sidebar" id="sidebar">
        <div class="brand">⚜️ San Francisco Javier</div>
        <a href="dashboard.html" class="menu-item">📊 Dashboard</a>
        <a href="miembros.html" class="menu-item">👥 Miembros</a>
        <a href="inventario.html" class="menu-item">📦 Inventario</a>
        <a href="objetivos.html" class="menu-item active">🎯 Objetivos tropa</a>
        <a href="gestion-patrullas.html" class="menu-item">🐂 Patrullas</a>
        <a href="usuarios.html" class="menu-item">🔑 Usuarios</a>
        <a href="campamento.html" class="menu-item">⛺ Campamento</a>
        <a href="calendario.html" class="menu-item">📅 Calendario</a>
        <a href="notas.html" class="menu-item">📝 Mis Notas</a>
        <div class="menu-item logout" onclick="logout()">Cerrar Sesión</div>
    </nav>

    <main class="content">
        <h1>Objetivos del Curso</h1>
        <p class="subtitle">Metas estratégicas de la Tropa</p>

        <div class="card">
            <div style="display:flex; gap:10px;">
                <input type="text" id="obj-input" placeholder="Ej: Que el 80% tenga la Promesa...">
                <button class="btn btn-primary" onclick="addObj()">Añadir</button>
            </div>
            <div id="lista-objetivos" style="margin-top:20px;"></div>
        </div>
    </main>

    <script type="module">
        import { collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./firebase-config.js";
        import "./auth-guard.js";

        window.toggleMenu = () => document.getElementById('sidebar').classList.toggle('active');
        const ref = collection(db, "objetivos_tropa");

        window.addObj = async () => {
            const txt = document.getElementById('obj-input').value;
            if(txt) {
                await addDoc(ref, { texto: txt, hecho: false, fecha: new Date() });
                document.getElementById('obj-input').value = "";
            }
        };

        onSnapshot(query(ref, orderBy("fecha")), (snap) => {
            const div = document.getElementById('lista-objetivos');
            div.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                div.innerHTML += `
                    <div style="padding:15px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" ${data.hecho ? 'checked' : ''} onchange="check('${d.id}', ${!data.hecho})" style="width:20px; height:20px;">
                        <span style="flex:1; font-size:1.1rem; ${data.hecho ? 'text-decoration:line-through; color:#aaa' : ''}">${data.texto}</span>
                        <button onclick="del('${d.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>`;
            });
        });

        window.check = (id, st) => updateDoc(doc(db, "objetivos_tropa", id), { hecho: st });
        window.del = (id) => deleteDoc(doc(db, "objetivos_tropa", id));
    </script>
</body>
</html>
