<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Kraal · Tropa Nube</title>
<link rel="icon" type="image/png" href="marca-agua.png">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scout.css">
</head>
<body class="entrada">
  <main class="entrada-card">
    <div class="logo"><img src="marca-agua.png" alt="Logo Tropa Nube"></div>
    <h1>Acceso Kraal</h1>
    <p class="sub">Zona de la jefatura: miembros, inventario, campamento y calendario.</p>
    <div id="error" class="error" role="alert"></div>
    <div class="campo"><label for="email">Correo</label><input type="text" id="email" autocomplete="username" autocapitalize="none"></div>
    <div class="campo"><label for="clave">Contraseña</label><input type="password" id="clave" autocomplete="current-password"></div>
    <button type="button" id="entrar" class="btn-grande">Entrar</button>
    <a href="index.html" class="volver">← Volver al inicio</a>
  </main>

<script type="module">
import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
const error = (t) => { $("error").textContent = t; $("error").classList.add("ver"); };

async function comprobar(uid) {
  const s = await getDoc(doc(db, "usuarios", uid));
  const rol = s.exists() ? s.data().rol : null;
  if (rol === "JT" || rol === "kraal") { window.location.href = "dashboard.html"; return; }
  await signOut(auth);
  error(rol ? "Esta cuenta es de scout. Entra desde «Entrar» en el inicio." : "Esta cuenta no tiene permisos de Kraal.");
}

async function entrar() {
  $("error").classList.remove("ver");
  const email = $("email").value.trim(), clave = $("clave").value;
  if (!email || !clave) return error("Escribe tu correo y tu contraseña.");
  $("entrar").disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, clave);
    await comprobar(cred.user.uid);
  } catch (e) { error("Correo o contraseña incorrectos."); }
  $("entrar").disabled = false;
}

$("entrar").addEventListener("click", entrar);
["email", "clave"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") entrar(); }));
onAuthStateChanged(auth, (u) => { if (u) comprobar(u.uid); });
</script>
</body>
</html>
